<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Cover placeholder">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <filter id="grain3">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.16"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg3)"/>
  <rect width="1600" height="1000" filter="url(#grain3)"/>
  <rect x="980" y="0" width="620" height="780" rx="80" fill="none" stroke="#fff" stroke-opacity="0.1" stroke-width="36"/>
  <rect x="1120" y="0" width="480" height="640" rx="64" fill="none" stroke="#fff" stroke-opacity="0.16" stroke-width="36"/>
  <rect x="1240" y="0" width="360" height="500" rx="48" fill="none" stroke="#fff" stroke-opacity="0.22" stroke-width="36"/>
</svg>
