<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Cover placeholder">
  <defs>
    <linearGradient id="bg4" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <filter id="grain4">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.16"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg4)"/>
  <rect width="1600" height="1000" filter="url(#grain4)"/>
  <circle cx="800" cy="500" r="280" fill="none" stroke="#fff" stroke-opacity="0.08" stroke-width="36"/>
  <circle cx="800" cy="500" r="180" fill="none" stroke="#fff" stroke-opacity="0.14" stroke-width="36"/>
  <circle cx="800" cy="500" r="80" fill="none" stroke="#fff" stroke-opacity="0.22" stroke-width="36"/>
</svg>
